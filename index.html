<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Çok Seviyorum ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e6;
            color: #4a4a4a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 15px;
            font-size: 28px;
        }

        .photo-container {
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .photo {
            width: 100%;
            height: auto;
            max-height: 400px;
            object-fit: cover;
            display: block;
            border-radius: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            outline: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>İyi Ki Doğdun! ❤️</h1>
        
        <div class="photo-container">
            <img class="photo" src="https://hizliresim.com/x2rgx2th" alt="Bizim Fotoğrafımız">
        </div>

        <p>
            Seninle geçen her anım, hayatımın en güzel parçası. İyi ki varsın, iyi ki hayatımdasın! 🌸✨
        </p>

        <audio controls autoplay loop>
            <source src="sarki.mp3" type="audio/mpeg">
            Tarayıcınız ses öğesini desteklemiyor.
        </audio>
    </div>

</body>
</html>
