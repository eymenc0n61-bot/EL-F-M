<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Çok Seviyorum ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Arka plan fotoğrafı net ve belirgin */
            background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)), url('https://i.hizliresim.com/x2rgx2th.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            /* Arka plan resminin görünmesi için şık yarısaydam beyaz kart */
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(5px);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
            font-size: 32px;
        }

        .photo-container {
            margin: 20px 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .photo {
            width: 100%;
            height: auto;
            max-height: 480px;
            object-fit: cover;
            display: block;
            border-radius: 15px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #444;
            margin: 20px 0;
            font-weight: 500;
        }

        audio {
            width: 100%;
            margin-top: 15px;
            outline: none;
            border-radius: 30px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>İyi Ki Doğdun! ❤️</h1>
        
        <div class="photo-container">
            <img class="photo" src="https://i.hizliresim.com/x2rgx2th.jpg" alt="Bizim Fotoğrafımız">
        </div>

        <p>
            Seninle geçen her anım, hayatımın en güzel parçası. İyi ki varsın, iyi ki hayatımdasın! 🌸✨
        </p>

        <audio controls autoplay loop>
            <source src="sarki.mp3" type="audio/mpeg">
            Tarayıcınız ses öğesini desteklemiyor.
        </audio>
    </div>

</body>
</html>
