<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAYATIMIN AŞKINA ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
    background-color: #0b132b;
    overflow-x: hidden;

    /* Arka Plan Fotoğrafın */
    background-image:
        linear-gradient(
            rgba(0, 30, 90, 0.70),
            rgba(10, 15, 50, 0.85)
        ),
        url("foto.png?v=5");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

/* HAREKETLİ KEDİ & PASTA GİRİŞ EKRANI */
#intro-screen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(10, 15, 40, 0.96);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    z-index: 99999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: opacity 1s ease, visibility 1s ease;
    cursor: pointer;
    user-select: none;
}

.cat-cake-box {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.cat-emoji {
    font-size: 110px;
    line-height: 1;
    animation: kediSallan 2s ease-in-out infinite;
}

.cake-wrapper {
    position: relative;
    margin-top: -30px;
    font-size: 85px;
    line-height: 1;
}

.flame {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 32px;
    animation: alevKipirda 0.4s infinite alternate;
}

@keyframes kediSallan {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(2deg); }
}

@keyframes alevKipirda {
    0% { transform: translateX(-50%) scale(1); opacity: 1; }
    100% { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
}

.intro-text {
    margin-top: 25px;
    font-size: 22px;
    font-weight: bold;
    color: #ffb3c6;
    text-shadow: 0 0 12px rgba(255, 179, 198, 0.6);
    animation: yaziYanSön 1.5s infinite;
}

@keyframes yaziYanSön {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(0.98); }
}

/* ANA SİTE İÇERİĞİ */
.container {
    width: 90%;
    max-width: 900px;
    margin: auto;
    padding: 50px 0;
    position: relative;
    z-index: 2;
}

h1 {
    font-size: 48px;
    margin-bottom: 12px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.7);
}

.subtitle {
    font-size: 20px;
    margin-bottom: 35px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.box {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 30px;
    padding: 35px;
    margin-bottom: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

.heart {
    font-size: 70px;
    margin-bottom: 20px;
    animation: kalp 1.5s infinite;
}

@keyframes kalp {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
}

.message {
    font-size: 20px;
    line-height: 1.8;
}

.music-box, .gift-box {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 25px;
    padding: 30px;
    margin-bottom: 30px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.3);
}

.music-box h2, .gift-box h2 {
    margin-bottom: 15px;
}

.music-box p {
    margin-bottom: 20px;
}

audio {
    width: 100%;
    max-width: 550px;
}

.gift {
    display: block;
    width: 90%;
    max-width: 600px;
    margin: 15px auto;
    padding: 17px;
    color: white;
    text-decoration: none;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 15px;
    font-size: 18px;
    font-weight: bold;
    transition: 0.3s;
}

.gift:hover {
    transform: scale(1.04);
    background: rgba(255,255,255,0.3);
}

footer {
    margin-top: 30px;
    padding-bottom: 20px;
    font-size: 16px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

.cicek-tanesi {
    position: fixed;
    top: -50px;
    z-index: 9999;
    pointer-events: none;
    animation: düsme linear forwards;
}

@keyframes düsme {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
    }
}
